<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勁起來舒緩放鬆 | Chunspace</title>
    <style>
        /* 基礎版面設定，營造乾淨放鬆的氛圍 */
        body {
            font-family: 'Helvetica Neue', Arial, '微軟正黑體', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 30px;
        }
        /* 按鈕設計 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            padding: 15px;
            font-size: 1.1em;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background-color: #4CAF50; /* 舒緩的綠色 */
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #f39c12; /* 溫暖的橘色 */
            color: #ffffff;
        }
        .btn-secondary:hover {
            background-color: #e67e22;
        }
        /* 測試用的版本標籤 */
        .test-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 16px;
            background-color: #ffebee;
            color: #c62828;
            border: 2px dashed #c62828;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>勁起來舒緩放鬆</h1>
        <p class="subtitle">專屬於您的舒緩空間 Chunspace</p>

        <div class="btn-group">
            <!-- 預約系統按鈕 -->
            <a href="#" class="btn btn-primary">Massage Booking (立即預約)</a>
            
            <!-- 活動查詢按鈕 -->
            <a href="#" class="btn btn-secondary">Upcoming Events (最新活動)</a>
        </div>

        <!-- 部署測試標記 -->
        <div class="test-badge">
            🚀 測試更新 v1.0
        </div>
    </div>

</body>
</html>
